<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPT Browser Regression</title>
    <style>
        body {
            font-family: Inter, system-ui, sans-serif;
            margin: 24px;
            color: #1f2937;
            background: #f7f3ee;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        .muted {
            color: #6b7280;
            margin-bottom: 16px;
        }
        .status {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .status.running { background: #fef3c7; color: #92400e; }
        .status.pass { background: #dcfce7; color: #166534; }
        .status.fail { background: #fee2e2; color: #991b1b; }
        pre {
            white-space: pre-wrap;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            max-width: 1100px;
            overflow: auto;
        }
        iframe {
            width: 1440px;
            height: 900px;
            border: 1px solid #d1d5db;
            background: #fff;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>JPT Browser Regression</h1>
    <div class="muted">Runs a same-origin browser regression against the main app.</div>
    <div id="status" class="status running">RUNNING</div>
    <pre id="results">Starting...</pre>
    <iframe id="app-frame" src="about:blank"></iframe>

    <script>
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function waitFor(label, fn, timeout = 20000, interval = 250) {
            const start = Date.now();
            while (Date.now() - start < timeout) {
                try {
                    const value = await fn();
                    if (value) return value;
                } catch (err) {
                    // Ignore transient frame errors during reload/navigation.
                }
                await sleep(interval);
            }
            throw new Error(`Timed out waiting for ${label}`);
        }

        function setStatus(text, cls) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = `status ${cls}`;
        }

        function writeResults(data) {
            document.getElementById('results').textContent =
                typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        function publishResult(result) {
            try {
                localStorage.setItem('jpt_browser_regression_result', JSON.stringify(result));
            } catch (err) {
                // Ignore storage failures in regression runner.
            }
            try {
                const summary = encodeURIComponent(JSON.stringify(result));
                history.replaceState(null, '', `${location.pathname}${location.search}#${summary}`);
            } catch (err) {
                // Ignore hash publication failures.
            }
        }

        function setProgress(step, extra = null) {
            const payload = { step, ...(extra || {}) };
            writeResults(payload);
            document.title = `JPT Browser Regression RUNNING - ${step}`;
        }

        function frameDoc() {
            return document.getElementById('app-frame').contentDocument;
        }

        function frameWin() {
            return document.getElementById('app-frame').contentWindow;
        }

        function getAuthToken() {
            return frameWin().localStorage.getItem('jpt_auth_token');
        }

        async function apiRequest(path, options = {}) {
            const token = getAuthToken();
            const response = await fetch(path, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {}),
                    ...(token ? { Authorization: `Bearer ${token}` } : {})
                }
            });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`API ${response.status}: ${text}`);
            }
            return response.json();
        }

        async function navigateFrame(url) {
            const frame = document.getElementById('app-frame');
            frame.src = url;
            await waitFor('frame document ready', () => {
                const doc = frame.contentDocument;
                return doc && doc.readyState === 'complete' && doc.getElementById('app');
            }, 20000);
            const win = frameWin();
            const dialogs = [];
            win.alert = (msg) => dialogs.push(String(msg));
            win.confirm = (msg) => {
                dialogs.push(`CONFIRM:${msg}`);
                return true;
            };
            return dialogs;
        }

        async function reloadAndReopenLead(leadId, targetTab) {
            setProgress(`reload-for-${targetTab}`);
            await navigateFrame(`/?regression=${Date.now()}`);

            // Wait for app to be ready
            await waitFor('app ready after reload', () => {
                const doc = frameDoc();
                return getComputedStyle(doc.getElementById('app')).display !== 'none' &&
                    !doc.getElementById('login-modal').classList.contains('show');
            }, 15000);
            await sleep(1000);

            // Navigate to handler
            setProgress(`navigate-handler-for-${targetTab}`);
            frameWin().switchModule('handler');
            await sleep(800);
            if (frameDoc().querySelectorAll('#handler-cards .inquiry-card').length === 0) {
                const stageSelect = frameDoc().getElementById('filter-stage');
                if (stageSelect) {
                    stageSelect.value = '';
                    stageSelect.dispatchEvent(new Event('change', { bubbles: true }));
                }
            }
            await waitFor('handler cards', () => frameDoc().querySelectorAll('#handler-cards .inquiry-card').length > 0);

            // Find and click the lead card by ID
            setProgress(`open-lead-for-${targetTab}`);
            const cards = frameDoc().querySelectorAll('#handler-cards .inquiry-card');
            let targetCard = null;
            for (const card of cards) {
                card.click();
                await sleep(300);
                await waitFor('detail panel', () => frameDoc().getElementById('detail-panel')?.classList.contains('open'));
                await waitFor('state loaded', () => frameWin().eval('!!State.currentInquiry && !!State.currentInquiry.id'));
                const currentId = frameWin().eval('State.currentInquiry.id');
                if (currentId === leadId) {
                    targetCard = card;
                    break;
                } else {
                    frameWin().closePanel();
                    await sleep(300);
                }
            }

            if (!targetCard) {
                throw new Error(`Could not find lead ${leadId} after reload`);
            }

            await waitFor('detail state', () => frameWin().eval('!!State.currentInquiry && !!State.currentInquiry._lead && !!State.currentInquiry._customer'));
            await sleep(500);

            // Switch to target tab
            setProgress(`switch-to-${targetTab}-tab`);
            frameDoc().querySelector(`#panel-tabs .panel-tab[data-tab="${targetTab}"]`).click();
            await sleep(500);
        }

        async function runImportLayoutRegression(beforeLogin, dialogs) {
            setProgress('import-layout');
            const frame = document.getElementById('app-frame');
            frame.style.width = '1280px';
            frame.style.height = '720px';
            frameWin().switchModule('export');
            const report = {
                format: 'JPT-XLSX-1.0-canonical', dataset_id: 'layout-regression',
                source_hash: 'layout-regression-hash', can_commit: false,
                canonical_summary: { total_source_rows: 300 },
                summary: { total: 900, error_count: 240, warning_count: 60 },
                member_mappings: [
                    { source_name: 'shared-member', mapping_key: 'shared-member::owner', purpose: 'owner', status: 'blocker' },
                    { source_name: 'shared-member', mapping_key: 'shared-member::task_assignee', purpose: 'task_assignee', status: 'blocker' },
                    ...Array.from({ length: 38 }, (_, index) => ({
                        source_name: `member-${index}`, mapping_key: `member-${index}::owner`, purpose: 'owner', status: 'blocker'
                    }))
                ].map(item => ({ ...item,
                    candidates: [{ id: 'leader', username: 'leader', display_name: 'Leader', role: 'leader' }]
                })),
                customer_mappings: Array.from({ length: 80 }, (_, index) => ({
                    external_key: `customer-${index}`, display_name: `Customer ${index}`,
                    status: 'create', candidates: []
                })),
                issues: Array.from({ length: 240 }, (_, index) => ({
                    severity: 'error', code: 'missing_required_field',
                    entity_type: 'leads', external_key: `lead-${index}`,
                    source_record_key: `row-${index}`, message: 'Required test field is missing'
                }))
            };
            const file = new (frameWin().File)(['layout'], 'layout-regression.xlsx');
            const transfer = new (frameWin().DataTransfer)();
            transfer.items.add(file);
            frameDoc().getElementById('import-file').files = transfer.files;
            frameWin().SpreadsheetImportState.useFile(file);
            frameWin().SpreadsheetImportState.setReport(file, report);
            frameWin().SpreadsheetImportView.render(report);
            frameDoc().getElementById('import-setup-details').open = false;
            await sleep(100);
            const preflight = frameDoc().getElementById('import-preflight-result');
            const action = frameDoc().querySelector('.wizard-action-bar').getBoundingClientRect();
            const language = frameDoc().getElementById('language-toggle').getBoundingClientRect();
            const main = frameDoc().querySelector('.main-content');
            const result = {
                beforeLogin, dialogs,
                preflightClientHeight: preflight.clientHeight,
                preflightScrollHeight: preflight.scrollHeight,
                preflightOverflow: frameWin().getComputedStyle(preflight).overflowY,
                actionBottom: action.bottom,
                viewportHeight: frameWin().innerHeight,
                mainOverflow: main.scrollHeight - main.clientHeight,
                languageTop: language.top,
                headerHeight: frameDoc().querySelector('.main-header').clientHeight,
                commitDisabled: frameDoc().getElementById('import-commit-btn').disabled,
                commitStatus: frameDoc().getElementById('import-commit-state').textContent.trim(),
                sharedMemberKeys: [...frameDoc().querySelectorAll('[data-member-key^="shared-member::"]')]
                    .map(item => item.dataset.memberKey).sort()
            };
            result.failures = [];
            if (result.preflightScrollHeight <= result.preflightClientHeight) result.failures.push('Preflight list did not scroll internally.');
            if (result.preflightOverflow !== 'auto') result.failures.push('Preflight overflow is not auto.');
            if (result.actionBottom > result.viewportHeight) result.failures.push('Import action bar left the viewport.');
            if (result.mainOverflow > 30) result.failures.push(`Import page overflowed by ${result.mainOverflow}px.`);
            if (result.languageTop < 0 || result.languageTop >= result.headerHeight) result.failures.push('Language toggle is outside the header.');
            if (!result.commitDisabled || !result.commitStatus.includes('240')) result.failures.push('Blocking import state is not explicit.');
            if (result.sharedMemberKeys.join('|') !== 'shared-member::owner|shared-member::task_assignee') result.failures.push('Purpose-specific member mapping keys collided.');
            writeResults(result);
            publishResult(result);
            setStatus(result.failures.length ? 'FAIL' : 'PASS', result.failures.length ? 'fail' : 'pass');
            document.title = `JPT Browser Regression ${result.failures.length ? 'FAIL' : 'PASS'}`;
            return result;
        }

        async function runJsonRefreshRegression(beforeLogin, dialogs) {
            setProgress('json-refresh');
            frameWin().switchModule('export');
            frameWin().showTransferWorkspace('json');
            const token = getAuthToken();
            const response = await fetch('/api/data/export', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { Authorization: `Bearer ${token}` } : {})
                },
                body: JSON.stringify({ lead_ids: null })
            });
            if (!response.ok) throw new Error(`Export failed: ${response.status}`);
            const blob = await response.blob();
            const file = new (frameWin().File)([blob], 'refresh-regression.json', {
                type: 'application/json'
            });
            const transfer = new (frameWin().DataTransfer)();
            transfer.items.add(file);
            frameDoc().getElementById('json-import-file').files = transfer.files;
            frameDoc().getElementById('nav-total').textContent = 'stale';
            frameDoc().getElementById('nav-parser-total').textContent = 'stale';
            const report = await frameWin().importJsonData();
            const dashboard = await apiRequest('/api/review/dashboard');
            const result = {
                beforeLogin, dialogs,
                reportReturned: Boolean(report),
                navTotal: frameDoc().getElementById('nav-total').textContent.trim(),
                navParser: frameDoc().getElementById('nav-parser-total').textContent.trim(),
                expectedNavTotal: String(dashboard.total_leads || 0),
                importResult: frameDoc().getElementById('json-import-result').textContent.trim()
            };
            result.failures = [];
            if (!result.reportReturned) result.failures.push('JSON import did not return a report.');
            if (result.navTotal !== result.expectedNavTotal) result.failures.push('Left navigation count was not refreshed.');
            if (result.navParser !== result.expectedNavTotal) result.failures.push('Parser navigation count was not refreshed.');
            if (!result.importResult) result.failures.push('Import result was not rendered.');
            writeResults(result);
            publishResult(result);
            setStatus(result.failures.length ? 'FAIL' : 'PASS', result.failures.length ? 'fail' : 'pass');
            document.title = `JPT Browser Regression ${result.failures.length ? 'FAIL' : 'PASS'}`;
            return result;
        }

        async function runSpreadsheetNetworkRegression(beforeLogin, dialogs) {
            setProgress('spreadsheet-network');
            frameWin().switchModule('export');
            const file = new (frameWin().File)(['network'], 'network-regression.xlsx');
            const transfer = new (frameWin().DataTransfer)();
            transfer.items.add(file);
            frameDoc().getElementById('import-file').files = transfer.files;
            frameWin().onImportFileChanged();
            const originalFetch = frameWin().fetch.bind(frameWin());
            let releaseRequest;
            let requestStarted = '';
            let preflightOutcome = 'network';
            const staleReport = {
                format: 'JPT-XLSX-1.0-canonical', dataset_id: 'stale-report-must-not-render',
                source_hash: 'stale-report-hash', can_commit: true,
                summary: { total: 1, error_count: 0, warning_count: 0 },
                canonical_summary: { total_source_rows: 1 }, member_mappings: [],
                customer_mappings: [], issues: []
            };
            frameWin().fetch = async (url, options) => {
                const path = String(url);
                if (path.includes('/api/data/spreadsheet/preflight')) {
                    requestStarted = 'preflight';
                    await new Promise(resolve => { releaseRequest = resolve; });
                    if (preflightOutcome === 'network') throw new TypeError('Failed to fetch');
                    return new frameWin.Response(JSON.stringify(staleReport), {
                        status: 200, headers: { 'Content-Type': 'application/json' }
                    });
                }
                if (path.includes('/api/data/spreadsheet/import')) {
                    requestStarted = 'commit';
                    await new Promise(resolve => { releaseRequest = resolve; });
                    throw new TypeError('Failed to fetch');
                }
                if (path.includes('/api/health')) throw new TypeError('Failed to fetch');
                return originalFetch(url, options);
            };
            try {
                const pending = frameWin().preflightImportData();
                await waitFor('preflight busy state', () => requestStarted === 'preflight' && releaseRequest);
                const picker = frameDoc().querySelector('.workbook-picker[for="import-file"]');
                const during = {
                    preflightDisabled: frameDoc().getElementById('import-preflight-btn').disabled,
                    recheckDisabled: frameDoc().getElementById('import-recheck-btn').disabled,
                    commitDisabled: frameDoc().getElementById('import-commit-btn').disabled,
                    fileDisabled: frameDoc().getElementById('import-file').disabled,
                    pickerDisabled: picker.getAttribute('aria-disabled'),
                    status: frameDoc().getElementById('import-commit-state').textContent.trim()
                };
                releaseRequest();
                await pending;
                const message = frameDoc().getElementById('import-preflight-result').textContent.trim();
                const preflightRecovered = !frameDoc().getElementById('import-file').disabled &&
                    picker.getAttribute('aria-disabled') === 'false';
                preflightOutcome = 'stale';
                requestStarted = '';
                releaseRequest = null;
                const sameTimestamp = 1710000000000;
                const staleA = new (frameWin().File)(['A'], 'same-metadata.xlsx', { lastModified: sameTimestamp });
                const staleB = new (frameWin().File)(['B'], 'same-metadata.xlsx', { lastModified: sameTimestamp });
                const staleATransfer = new (frameWin().DataTransfer)();
                staleATransfer.items.add(staleA);
                frameDoc().getElementById('import-file').files = staleATransfer.files;
                frameWin().onImportFileChanged();
                const pendingStale = frameWin().preflightImportData();
                await waitFor('stale preflight busy state', () => requestStarted === 'preflight' && releaseRequest);
                const staleBTransfer = new (frameWin().DataTransfer)();
                staleBTransfer.items.add(staleB);
                frameDoc().getElementById('import-file').files = staleBTransfer.files;
                frameWin().onImportFileChanged();
                releaseRequest();
                await pendingStale;
                const staleReportIgnored = frameDoc().getElementById('import-file').files[0] === staleB &&
                    !frameWin().SpreadsheetImportState.hasReport() &&
                    !frameDoc().getElementById('import-preflight-result').textContent.includes('stale-report-must-not-render');
                const commitTransfer = new (frameWin().DataTransfer)();
                commitTransfer.items.add(file);
                frameDoc().getElementById('import-file').files = commitTransfer.files;
                frameWin().onImportFileChanged();
                const commitReport = {
                    format: 'JPT-XLSX-1.0-canonical', dataset_id: 'network-regression',
                    source_hash: 'network-regression-hash', can_commit: true,
                    summary: { total: 1, error_count: 0, warning_count: 0 },
                    canonical_summary: { total_source_rows: 1 }, member_mappings: [],
                    customer_mappings: [], issues: []
                };
                frameWin().SpreadsheetImportState.setReport(file, commitReport);
                frameWin().SpreadsheetImportView.render(commitReport);
                frameWin().SpreadsheetImportProgress.sync();
                requestStarted = '';
                releaseRequest = null;
                const pendingCommit = frameWin().importData();
                await waitFor('commit busy state', () => requestStarted === 'commit' && releaseRequest);
                const commitDuring = {
                    fileDisabled: frameDoc().getElementById('import-file').disabled,
                    pickerDisabled: picker.getAttribute('aria-disabled')
                };
                releaseRequest();
                await pendingCommit;
                const commitMessage = frameDoc().getElementById('import-result').textContent.trim();
                const result = {
                    beforeLogin, dialogs, during, message, preflightRecovered,
                    staleReportIgnored, commitDuring, commitMessage,
                    pickerLockedAfterUnconfirmed: frameDoc().getElementById('import-file').disabled &&
                        picker.getAttribute('aria-disabled') === 'true' &&
                        frameDoc().getElementById('import-commit-btn').disabled
                };
                result.failures = [];
                if (!during.preflightDisabled || !during.recheckDisabled || !during.commitDisabled) {
                    result.failures.push('Spreadsheet actions were not locked during preflight.');
                }
                if (!during.fileDisabled || during.pickerDisabled !== 'true') {
                    result.failures.push('Workbook picker was not locked during preflight.');
                }
                if (!during.status.includes('预检') && !during.status.includes('preflight')) {
                    result.failures.push('Preflight progress was not visible.');
                }
                if (message.includes('Failed to fetch')) result.failures.push('Raw browser network error leaked into the UI.');
                if (!message.includes('尚未导入') && !message.includes('was not imported')) {
                    result.failures.push('Network error did not confirm that the workbook was not imported.');
                }
                if (!result.preflightRecovered) result.failures.push('Workbook picker did not recover after preflight failure.');
                if (!result.staleReportIgnored) result.failures.push('A stale preflight response overwrote a same-metadata replacement file.');
                if (!commitDuring.fileDisabled || commitDuring.pickerDisabled !== 'true') {
                    result.failures.push('Workbook picker was not locked during commit.');
                }
                if ((!commitMessage.includes('无法确认') && !commitMessage.includes('could not be confirmed')) ||
                    (!commitMessage.includes('目标业务记录') && !commitMessage.includes('target records'))) {
                    result.failures.push('Commit failure did not explain the unconfirmed outcome and record verification.');
                }
                if (commitMessage.includes('尚未导入') || commitMessage.includes('was not imported')) {
                    result.failures.push('Commit failure made an unsafe not-imported claim.');
                }
                if (!result.pickerLockedAfterUnconfirmed) result.failures.push('Unconfirmed commit did not remain locked against immediate retry.');
                writeResults(result);
                publishResult(result);
                setStatus(result.failures.length ? 'FAIL' : 'PASS', result.failures.length ? 'fail' : 'pass');
                document.title = `JPT Browser Regression ${result.failures.length ? 'FAIL' : 'PASS'}`;
                return result;
            } finally {
                frameWin().fetch = originalFetch;
            }
        }

        async function run() {
            const params = new URLSearchParams(location.search);
            const username = params.get('username');
            const password = params.get('password');
            if (!username || !password) throw new Error('Pass test credentials with ?username=...&password=...');
            const mode = params.get('mode') || 'full';
            const dialogs = [];

            setProgress('navigate-initial');
            dialogs.push(...await navigateFrame(`/?regression=${Date.now()}`));
            setProgress('clear-auth');
            frameWin().localStorage.clear();
            setProgress('navigate-fresh');
            dialogs.push(...await navigateFrame(`/?regression=${Date.now()}&fresh=1`));

            setProgress('wait-login-modal');
            await waitFor('login modal', () => frameDoc().getElementById('login-modal')?.classList.contains('show'));

            const beforeLogin = {
                loginVisible: frameDoc().getElementById('login-modal').classList.contains('show'),
                appDisplay: getComputedStyle(frameDoc().getElementById('app')).display
            };

            frameDoc().getElementById('login-username').value = username;
            frameDoc().getElementById('login-password').value = password;
            setProgress('submit-login');
            frameWin().handleLogin();

            setProgress('wait-app');
            await waitFor('app after login', () => {
                const doc = frameDoc();
                return getComputedStyle(doc.getElementById('app')).display !== 'none' &&
                    !doc.getElementById('login-modal').classList.contains('show');
            }, 25000);
            await sleep(1200);

            if (mode === 'import-layout') {
                await runImportLayoutRegression(beforeLogin, dialogs);
                return;
            }
            if (mode === 'json-refresh') {
                await runJsonRefreshRegression(beforeLogin, dialogs);
                return;
            }
            if (mode === 'spreadsheet-network') {
                await runSpreadsheetNetworkRegression(beforeLogin, dialogs);
                return;
            }

            setProgress('collect-dashboard');
            const dashboardApiData = await apiRequest('/api/review/dashboard');
            const mapApiData = await apiRequest('/api/review/map');
            const dashboard = {
                userName: frameDoc().getElementById('user-name')?.textContent?.trim(),
                userRole: frameDoc().getElementById('user-role')?.textContent?.trim(),
                kpiTotal: frameDoc().getElementById('kpi-total')?.textContent?.trim(),
                kpiFollowing: frameDoc().getElementById('kpi-following')?.textContent?.trim(),
                kpiWon: frameDoc().getElementById('kpi-won')?.textContent?.trim(),
                kpiWonValue: frameDoc().getElementById('kpi-pipeline')?.textContent?.trim(),
                apiWonValueK: Math.round((dashboardApiData.won_value || 0) / 1000).toLocaleString(),
                navTotal: frameDoc().getElementById('nav-total')?.textContent?.trim(),
                navParser: frameDoc().getElementById('nav-parser-total')?.textContent?.trim(),
                navHandler: frameDoc().getElementById('nav-handler-total')?.textContent?.trim(),
                navFollowup: frameDoc().getElementById('nav-followup-total')?.textContent?.trim(),
                navSampling: frameDoc().getElementById('nav-sampling-total')?.textContent?.trim(),
                navDeal: frameDoc().getElementById('nav-deal-total')?.textContent?.trim(),
                navFulfillment: frameDoc().getElementById('nav-fulfillment-total')?.textContent?.trim(),
                funnelRows: frameDoc().querySelectorAll('#pipeline-funnel > *').length,
                mapPane: !!frameDoc().querySelector('#world-map .leaflet-pane'),
                mapMarkers: frameDoc().querySelectorAll('#world-map .leaflet-marker-icon, #world-map .leaflet-interactive').length,
                mapSummaryText: frameDoc().getElementById('map-summary')?.textContent?.trim(),
                mapApiPoints: (mapApiData.points || []).length,
                mapApiApproximatePoints: mapApiData.summary?.approximate_points || 0,
                mapStageFilterOptions: Array.from(frameDoc().querySelectorAll('#map-stage-filter option')).map(o => o.value),
                mapOutcomeFilterOptions: Array.from(frameDoc().querySelectorAll('#map-outcome-filter option')).map(o => o.value),
                mapQualityFilterOptions: Array.from(frameDoc().querySelectorAll('#map-quality-filter option')).map(o => o.value),
                stageFilterOptions: Array.from(frameDoc().querySelectorAll('#filter-stage option')).map(o => o.value),
                navAftersales: frameDoc().getElementById('nav-aftersales-total')?.textContent?.trim()
            };

            setProgress('check-stage-buckets');
            const stageBuckets = { handler: {}, followup: {}, deal: {}, fulfillment: {} };
            frameWin().switchModule('handler');
            await sleep(800);
            stageBuckets.handler = {
                filterValue: frameDoc().getElementById('filter-stage')?.value,
                cardCount: frameDoc().querySelectorAll('#handler-cards .inquiry-card').length,
                cardStages: Array.from(frameDoc().querySelectorAll('#handler-cards .card-footer .stage-badge')).map(el => el.textContent.trim()),
                navCount: frameDoc().getElementById('nav-handler-total')?.textContent?.trim()
            };

            frameWin().switchModule('followup');
            await sleep(800);
            stageBuckets.followup = {
                cardCount: frameDoc().querySelectorAll('#followup-cards .inquiry-card').length,
                cardStages: Array.from(frameDoc().querySelectorAll('#followup-cards .card-footer .stage-badge')).map(el => el.textContent.trim()),
                cardSummaries: Array.from(frameDoc().querySelectorAll('#followup-cards .inquiry-card')).map(card => {
                    const values = card.querySelectorAll('.card-details .card-value');
                    return {
                        displayId: card.querySelector('.card-meta span')?.textContent?.trim(),
                        followUpCount: Number(values[0]?.textContent?.trim() || 0)
                    };
                }),
                cardFollowUpCounts: Array.from(frameDoc().querySelectorAll('#followup-cards .inquiry-card')).map(card => {
                    const values = card.querySelectorAll('.card-details .card-value');
                    return Number(values[0]?.textContent?.trim() || 0);
                }),

                }
                if (exchangeAfter.importErrors.length > 0) {
                    failures.push(`Import had errors: ${exchangeAfter.importErrors.join(', ')}`);
                }
                if (!exchangeAfter.countsUnchanged) {
                    failures.push(`Import changed record counts (customers: ${exchangeBefore.customerCount} → ${exchangeAfter.finalCustomerCount}, leads: ${exchangeBefore.leadCount} → ${exchangeAfter.finalLeadCount})`);
                }
                if (!exchangeAfter.navigationRefreshed) failures.push('Import did not refresh the left navigation counts.');
            }
            if (JSON.stringify(dashboard.stageFilterOptions) !== JSON.stringify(['New', '', 'Assigned', 'Following', 'Quoted', 'Won', 'Lost'])) {
                failures.push(`Handler stage filter options are stale: ${dashboard.stageFilterOptions.join(', ')}`);
            }
            if (JSON.stringify(dashboard.mapStageFilterOptions) !== JSON.stringify(['', ...expectedStages])) {
                failures.push(`Review Map stage filter options are stale: ${dashboard.mapStageFilterOptions.join(', ')}`);
            }
            if (JSON.stringify(dashboard.mapOutcomeFilterOptions) !== JSON.stringify(['', 'open', 'won', 'lost'])) {
                failures.push(`Review Map outcome filter options are stale: ${dashboard.mapOutcomeFilterOptions.join(', ')}`);
            }
            if (JSON.stringify(dashboard.mapQualityFilterOptions) !== JSON.stringify(['', 'exact', 'needs_geocode'])) {
                failures.push(`Review Map coordinate quality filter options are stale: ${dashboard.mapQualityFilterOptions.join(', ')}`);
            }

            results.failures = failures;
            writeResults(results);
            publishResult(results);

            if (failures.length) {
                document.title = `JPT Browser Regression FAIL - ${failures[0]}`;
                setStatus('FAIL', 'fail');
            } else {
                document.title = 'JPT Browser Regression PASS';
                setStatus('PASS', 'pass');
            }
        }

        run().catch((error) => {
            const result = {
                failures: [error.message],
                stack: error.stack
            };
            setStatus('FAIL', 'fail');
            document.title = `JPT Browser Regression FAIL - ${error.message}`;
            writeResults(result);
            publishResult(result);
        });
    </script>
</body>
</html>
