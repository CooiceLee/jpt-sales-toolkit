name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-internal"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Enforce internal-only release contract
        shell: bash
        run: |
          version="$(< VERSION)"
          [[ "$version" == *-internal ]] || { echo "VERSION must end in -internal" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
              exit 1
            }
          fi
      - name: Run source validation
        run: bash scripts/validate_v08.sh

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            (Get-Content VERSION -Raw).Trim()
          }
          python scripts/stamp_build_version.py $version | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Build frozen application
        run: pyinstaller --clean --noconfirm packaging/jpt_sales_toolkit.spec
      - name: Verify Windows executable architecture
        shell: pwsh
        run: |
          $exe = "dist\JPT Sales Toolkit\JPT Sales Toolkit.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 64) { throw "Invalid PE executable" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected Windows x64 PE machine 0x8664, got 0x$($machine.ToString('X4'))" }
      - name: Smoke test frozen application
        run: python scripts/smoke_frozen.py "dist/JPT Sales Toolkit/JPT Sales Toolkit.exe"
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          $name = "JPT-Sales-Toolkit-$env:BUILD_VERSION-Windows-x64-UNSIGNED-INTERNAL-Setup"
          $source = "$pwd\dist\JPT Sales Toolkit"
          & $iscc "/DAppVersion=$env:BUILD_VERSION" "/DVersionInfoVersion=$env:FILE_VERSION" "/DSourceDir=$source" "/DOutputDir=$pwd\release" "/DOutputBaseFilename=$name" "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test installed Windows application
        shell: pwsh
        run: |
          $installer = Get-Item release\*.exe
          $installDir = "$pwd\installed"
          $installProcess = Start-Process -Wait -PassThru -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed with exit code $($installProcess.ExitCode)" }
          foreach ($name in @("user.json", "team.json", "regression.html", "smoke-v09.html", "database.sqlite")) {
            if (Get-ChildItem $installDir -Recurse -Filter $name) { throw "Prohibited packaged asset: $name" }
          }
          foreach ($pattern in @("*.xlsx", "*.jptauth", "*.jptreq")) {
            if (Get-ChildItem $installDir -Recurse -Filter $pattern) { throw "Prohibited packaged asset: $pattern" }
          }
          python scripts/smoke_frozen.py "$installDir\JPT Sales Toolkit.exe"
          $env:LOCALAPPDATA = "$pwd\isolated-localappdata"
          $upgradeData = "$env:LOCALAPPDATA\JPT Sales Toolkit\data"
          python scripts/smoke_upgrade_frozen.py "$installDir\JPT Sales Toolkit.exe" --data-dir $upgradeData --fixture-version 0.11.3-internal --launch-with-default-data-dir
          $schemaOneData = "$pwd\upgrade-0.11.7"
          python scripts/smoke_upgrade_frozen.py "$installDir\JPT Sales Toolkit.exe" --data-dir $schemaOneData --fixture-version 0.11.7-internal
          $currentSchemaData = "$pwd\upgrade-0.11.8"
          python scripts/smoke_upgrade_frozen.py "$installDir\JPT Sales Toolkit.exe" --data-dir $currentSchemaData --fixture-version 0.11.8-internal
          $directBaselineData = "$pwd\upgrade-0.11.9"
          python scripts/smoke_upgrade_frozen.py "$installDir\JPT Sales Toolkit.exe" --data-dir $directBaselineData --fixture-version 0.11.9-internal
          $uninstallProcess = Start-Process -Wait -PassThru -FilePath "$installDir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstallProcess.ExitCode)" }
          if (Test-Path "$installDir\JPT Sales Toolkit.exe") { throw "Installed executable remains after uninstall" }
          if (!(Test-Path "$upgradeData\database.sqlite")) { throw "Uninstall removed the default user data directory" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: release/*.exe
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(< VERSION)"
          fi
          python scripts/stamp_build_version.py "$version" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Build frozen application
        run: pyinstaller --clean --noconfirm packaging/jpt_sales_toolkit.spec
      - name: Verify macOS executable architecture
        run: |
          archs="$(lipo -archs 'dist/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit')"
          [[ " $archs " == *" arm64 "* ]] || {
            echo "Expected Apple Silicon arm64 executable, got: $archs" >&2
            exit 1
          }
      - name: Smoke test frozen application
        run: python scripts/smoke_frozen.py "dist/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit"
      - name: Build unsigned internal DMG
        run: bash packaging/macos/build_dmg.sh "$BUILD_VERSION" "AppleSilicon-arm64"
      - name: Verify and smoke test mounted DMG
        run: |
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil verify "$dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          cleanup_mount() {
            for attempt in 1 2 3; do
              if hdiutil detach "$mount_dir"; then
                return 0
              fi
              sleep 2
            done
            hdiutil detach -force "$mount_dir"
          }
          trap cleanup_mount EXIT
          for name in user.json team.json regression.html smoke-v09.html database.sqlite; do
            if find "$mount_dir/JPT Sales Toolkit.app" -name "$name" -print -quit | grep -q .; then
              echo "Prohibited packaged asset: $name" >&2
              exit 1
            fi
          done
          for pattern in '*.xlsx' '*.jptauth' '*.jptreq'; do
            if find "$mount_dir/JPT Sales Toolkit.app" -name "$pattern" -print -quit | grep -q .; then
              echo "Prohibited packaged asset: $pattern" >&2
              exit 1
            fi
          done
          codesign --verify --deep --strict --verbose=2 "$mount_dir/JPT Sales Toolkit.app"
          python scripts/smoke_frozen.py --expect-disk-image "$mount_dir/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit"
          upgrade_data="$RUNNER_TEMP/jpt-upgrade-AppleSilicon-arm64-0.11.4"
          python scripts/smoke_upgrade_frozen.py \
            --expect-disk-image \
            --data-dir "$upgrade_data" \
            --fixture-version 0.11.4-internal \
            "$mount_dir/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit"
          test -f "$upgrade_data/database.sqlite"
          schema_one_data="$RUNNER_TEMP/jpt-upgrade-AppleSilicon-arm64-0.11.7"
          python scripts/smoke_upgrade_frozen.py \
            --expect-disk-image \
            --data-dir "$schema_one_data" \
            --fixture-version 0.11.7-internal \
            "$mount_dir/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit"
          test -f "$schema_one_data/database.sqlite"
          current_schema_data="$RUNNER_TEMP/jpt-upgrade-AppleSilicon-arm64-0.11.8"
          python scripts/smoke_upgrade_frozen.py \
            --expect-disk-image \
            --data-dir "$current_schema_data" \
            --fixture-version 0.11.8-internal \
            "$mount_dir/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit"
          test -f "$current_schema_data/database.sqlite"
          direct_baseline_data="$RUNNER_TEMP/jpt-upgrade-AppleSilicon-arm64-0.11.9"
          python scripts/smoke_upgrade_frozen.py \
            --expect-disk-image \
            --data-dir "$direct_baseline_data" \
            --fixture-version 0.11.9-internal \
            "$mount_dir/JPT Sales Toolkit.app/Contents/MacOS/JPT Sales Toolkit"
          test -f "$direct_baseline_data/database.sqlite"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-AppleSilicon-arm64-installer
          path: release/*.dmg
          if-no-files-found: error

  checksums:
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum *.exe *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installer-checksums
          path: release-assets/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --prerelease \
              --title "JPT Sales Toolkit $GITHUB_REF_NAME (Internal)"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --draft \
              --prerelease \
              --title "JPT Sales Toolkit $GITHUB_REF_NAME (Internal)" \
              --notes "Unsigned internal pilot installers. Member authorization files are distributed separately by the Leader."
          fi
